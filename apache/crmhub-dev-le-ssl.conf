<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName dev-crm.digitalalliancehub.site
    ProxyPreserveHost On
    # Permite incrustar esta empresa solo en el Centro de control (modo lectura); nadie más puede enmarcarla
    Header always append Content-Security-Policy "frame-ancestors 'self' https://control.digitalalliancehub.site"
    RewriteEngine On

    # WebSocket de EspoCRM
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/ws$ ws://127.0.0.1:8300/ [P,L]

    # Webhooks de ingesta (Facebook/Instagram, Evolution API, formularios) -> Hub Service
    ProxyPass        /hub/ http://172.28.0.1:8190/v1/ingest/dev/ retry=0
    ProxyPassReverse /hub/ http://172.28.0.1:8190/v1/ingest/dev/

    # Formularios web públicos de captación: https://<dominio>/f/<nombre-del-formulario>
    ProxyPass        /f/ http://172.28.0.1:8190/v1/public/dev/forms/ retry=0
    ProxyPassReverse /f/ http://172.28.0.1:8190/v1/public/dev/forms/

    ProxyPass        / http://127.0.0.1:8200/ timeout=300
    ProxyPassReverse / http://127.0.0.1:8200/
    RequestHeader set X-Forwarded-Proto "https"

    # PWA: el service worker debe poder controlar todo el sitio y no cachearse
    <Location "/client/custom/sw.js">
        Header set Service-Worker-Allowed "/"
        Header set Cache-Control "no-cache"
    </Location>
    <Location "/client/custom/version.json">
        Header set Cache-Control "no-store"
    </Location>
    <Location "/client/custom/manifest.webmanifest">
        Header set Content-Type "application/manifest+json"
    </Location>

    ErrorLog  ${APACHE_LOG_DIR}/crmhub-dev-error.log
    CustomLog ${APACHE_LOG_DIR}/crmhub-dev-access.log combined

SSLCertificateFile /etc/letsencrypt/live/dev-crm.digitalalliancehub.site/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/dev-crm.digitalalliancehub.site/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
