<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName crm.digitalalliancehub.site
    ProxyPreserveHost On
    RewriteEngine On

    # WebSocket de EspoCRM
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/ws$ ws://127.0.0.1:8301/ [P,L]

    # Webhooks de ingesta (Facebook/Instagram, Evolution API, formularios) -> Hub Service
    ProxyPass        /hub/ http://172.28.0.1:8190/v1/ingest/prod/ retry=0
    ProxyPassReverse /hub/ http://172.28.0.1:8190/v1/ingest/prod/

    ProxyPass        / http://127.0.0.1:8201/ timeout=300
    ProxyPassReverse / http://127.0.0.1:8201/
    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog  ${APACHE_LOG_DIR}/crmhub-prod-error.log
    CustomLog ${APACHE_LOG_DIR}/crmhub-prod-access.log combined

SSLCertificateFile /etc/letsencrypt/live/dev-crm.digitalalliancehub.site/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/dev-crm.digitalalliancehub.site/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
