name: crmhub

networks:
  crmhub_net:
    name: crmhub_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

volumes:
  crmhub_pg:
    name: crmhub_pg
  crmhub_stt_models:
    name: crmhub_stt_models
  crmhub_recordings:
    name: crmhub_recordings

services:
  postgres:
    image: postgres:16-alpine
    container_name: crmhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_ADMIN_USER}
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD}
      POSTGRES_DB: ${PG_MASTER_DB}
    volumes:
      - crmhub_pg:/var/lib/postgresql/data
      - ./hub-service/sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${PG_HOST_PORT}:5432"
    networks: [crmhub_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_ADMIN_USER} -d ${PG_MASTER_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Red host: Ollama solo escucha en 127.0.0.1. El servicio se enlaza al gateway
  # de crmhub_net (172.28.0.1) para que los tenants lo alcancen sin exponerlo a internet.
  hub-service:
    build: ./hub-service
    container_name: crmhub-hub-service
    restart: unless-stopped
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${PG_ADMIN_USER}:${PG_ADMIN_PASSWORD}@127.0.0.1:${PG_HOST_PORT}/${PG_MASTER_DB}
      HUB_BIND_HOST: ${HUB_BIND_HOST}
      HUB_PORT: ${HUB_PORT}
      HUB_ADMIN_TOKEN: ${HUB_ADMIN_TOKEN}
      OLLAMA_URL: ${OLLAMA_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT}
      VAPID_SUBJECT: mailto:${CERTBOT_EMAIL}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://api.telegram.org}
      META_GRAPH_BASE: ${META_GRAPH_BASE:-https://graph.facebook.com/v25.0}
      GUPSHUP_BASE: ${GUPSHUP_BASE:-https://api.gupshup.io}
      TWILIO_BASE: ${TWILIO_BASE:-https://api.twilio.com}
      ALLOW_LOOPBACK_URLS: ${ALLOW_LOOPBACK_URLS:-0}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      MEET_HOST: ${MEET_HOST:-}
      BROWSER_URL: ${BROWSER_URL:-http://127.0.0.1:8198}
      BROWSER_TOKEN: ${BROWSER_TOKEN}
      RECORDINGS_DIR: /recordings
    volumes:
      - crmhub_recordings:/recordings

  # Videollamadas propias: servidor LiveKit. La señal solo escucha en 127.0.0.1 (Apache la publica con SSL en meet.<dominio>);
  # los medios usan 7881/tcp y 50000-50100/udp, que hay que abrir y reenviar hacia este servidor.
  livekit:
    image: livekit/livekit-server:v1.8.0
    container_name: crmhub-livekit
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"

  # Voz a texto local (faster-whisper en CPU) para los subtítulos de las videollamadas. Solo escucha en 127.0.0.1:8197; el modelo se guarda en el volumen.
  stt:
    build: ./stt-service
    container_name: crmhub-stt
    restart: unless-stopped
    network_mode: host
    volumes:
      - crmhub_stt_models:/root/.cache
    environment:
      STT_MODEL: ${STT_MODEL:-small}
      STT_THREADS: ${STT_THREADS:-4}

  # Navegador automático (Chromium con Playwright) para las consultas web con login y navegación: grabar un flujo viendo la página y ejecutarlo sin pantalla.
  # Solo escucha en 127.0.0.1:8198; revisa cada petición para no alcanzar redes privadas; el Hub lo llama con BROWSER_TOKEN.
  browser:
    build: ./browser-service
    container_name: crmhub-browser
    restart: unless-stopped
    network_mode: host
    ipc: host
    init: true
    environment:
      BROWSER_TOKEN: ${BROWSER_TOKEN}
      BROWSER_PORT: ${BROWSER_PORT:-8198}

  # Centro de control: crear/vigilar empresas, restablecer claves y entrar en modo lectura.
  # Solo escucha en 127.0.0.1; Apache lo publica con SSL. Los trabajos privilegiados los ejecuta bin/control-worker.
  control:
    build: ./control-service
    container_name: crmhub-control
    restart: unless-stopped
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./tenants:/tenants
    environment:
      DATABASE_URL: postgresql://${PG_ADMIN_USER}:${PG_ADMIN_PASSWORD}@127.0.0.1:${PG_HOST_PORT}/${PG_MASTER_DB}
      CONTROL_USER: ${CONTROL_USER:-superadmin}
      CONTROL_PASSWORD_HASH: ${CONTROL_PASSWORD_HASH:-}
      CONTROL_SESSION_SECRET: ${CONTROL_SESSION_SECRET:-}
      BASE_DOMAIN: ${BASE_DOMAIN}
      CONTROL_BIND_HOST: 127.0.0.1
      CONTROL_PORT: ${CONTROL_PORT:-8195}
      CONTROL_EMAIL: ${CONTROL_EMAIL:-${CERTBOT_EMAIL}}
      CONTROL_HOST: ${CONTROL_HOST:-control.${BASE_DOMAIN}}
